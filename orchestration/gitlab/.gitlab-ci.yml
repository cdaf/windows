# If stages is not defined in the .gitlab-ci.yml file, the default pipeline stages are:
#stages:
#  - .pre
#  - build
#  - test
#  - deploy
#  - .post

CI:
  stage: build

  # To use native container runner with CDAF pre-installed
  image: cdaf/windows
  script: entry.ps1 ${CI_PIPELINE_IID} ${CI_COMMIT_BRANCH}

  # Self-hosted Runner
  # tags:
  #   - batch

  # Install Edge Version
  #  script: |
  #    . { iwr -useb https://raw.githubusercontent.com/cdaf/windows/master/install.ps1 } | iex
  #    .\automation\entry.ps1 ${CI_PIPELINE_IID} ${CI_COMMIT_BRANCH}

  # Install Latest Version
  #  script: |
  #    . { iwr -useb https://cdaf.io/static/app/downloads/cdaf.ps1 } | iex
  #    .\automation\entry.bat ${CI_PIPELINE_IID} ${CI_COMMIT_BRANCH}

  artifacts:
    paths:
    - release.ps1
    reports:
      junit: "**/test-results/*.xml"
      coverage_report:
        coverage_format: cobertura  # or jacoco
        path: "**/coverage/*.xml"

TEST:
  stage: test
  tags:
    - batch
  script: "./release.ps1 ${CI_JOB_NAME} ${CI_PIPELINE_ID}"
  environment: "${CI_JOB_STAGE}"
  dependencies:
    - CI
  only:
    - master

PROD:
  stage: deploy
  tags:
    - batch
  script: |
    ./release.ps1 ${CI_JOB_NAME} ${CI_PIPELINE_ID}
#    $manifest = Get-Content ./TasksLocal/manifest.txt
#    $ARTIFACT_PREFIX = ($manifest | Select-String 'artifactPrefix=').Line.Split('=')[1]
#    $BUILDNUMBER = ($manifest | Select-String 'BUILDNUMBER=').Line.Split('=')[1]
#    "RELEASE_VERSION=$ARTIFACT_PREFIX.$BUILDNUMBER" | Out-File -FilePath release.env -Encoding ascii
#    Write-Output ""
#    Write-Output "cat release.env"
#    Write-Output ""
    Get-Content release.env
  environment: "${CI_JOB_STAGE}"
  dependencies:
    - TEST
  only:
    - master
  when: manual

